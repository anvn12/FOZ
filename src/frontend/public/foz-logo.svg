<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
<linearGradient id="foz-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#2891DD" />
  <stop offset="50%" stop-color="#00A4EF" />
  <stop offset="100%" stop-color="#6366D9" />
</linearGradient>
  </defs>
  <g fill="url(#foz-logo-grad)">
    <!-- Horizontal arm -->
    <rect x="15" y="42" width="70" height="16" rx="8" />
    <!-- Vertical arm -->
    <rect x="42" y="15" width="16" height="70" rx="8" />
    <!-- Diagonal 45 deg -->
    <rect x="15" y="42" width="70" height="16" rx="8" transform="rotate(45 50 50)" />
    <!-- Diagonal 135 deg -->
    <rect x="15" y="42" width="70" height="16" rx="8" transform="rotate(135 50 50)" />
  </g>
</svg>
