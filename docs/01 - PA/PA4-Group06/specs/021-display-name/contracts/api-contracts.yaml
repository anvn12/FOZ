openapi: 3.0.3
info:
  title: FOZ Username & Display Name API Contract
  version: 1.0.0
  description: API endpoints for Username registration, availability checking, and handle-based profile lookup.

paths:
  /api/v1/auth/check-username:
    get:
      summary: Check username availability
      description: Real-time availability and constraint validation check for username during registration. Rate limited.
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
          example: john_doe
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  reason:
                    type: string
                    nullable: true
                    example: "This username is already taken"
        '429':
          description: Rate limit exceeded

  /api/v1/auth/register:
    post:
      summary: Register account with username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - username
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                username:
                  type: string
                  minLength: 3
                  maxLength: 30
                  pattern: '^[a-z0-9._]+$'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input or validation failed
        '409':
          description: Email or Username already exists

  /api/v1/profiles/by-username/{username}:
    get:
      summary: Get profile by handle
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: john_doe
      responses:
        '200':
          description: Profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileWithUser'
        '404':
          description: User or profile not found

components:
  schemas:
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            username:
              type: string
            role:
              type: string
            status:
              type: string
    ProfileWithUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userAccountId:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        bio:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
