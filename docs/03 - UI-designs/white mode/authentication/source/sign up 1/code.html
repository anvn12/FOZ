<!DOCTYPE html>

<html class="light" lang="en"><head>

                      "surface-container": "#eeeeee",
                      "surface-container-lowest": "#ffffff",
                      "on-primary-fixed": "#1b1b1b",
                      "secondary": "#5e5e5e",
                      "error": "#ba1a1a",
                      "on-secondary-fixed-variant": "#464747",
                      "background": "#f9f9f9",

                      "primary": "#000000",
                      "tertiary-fixed": "#e2e2e2",
                      "on-surface": "#1a1c1c",

                      "surface-tint": "#5e5e5e",

                      "on-tertiary-container": "#838484",

              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "4px",
                      "gutter": "16px",
                      "margin-mobile": "16px",
                      "margin-desktop": "24px",
                      "max-width": "640px"
              },
              "fontFamily": {
                      "headline-md": [
                              "Inter"
                      ],
                      "label-md": [

                      ],
                      "label-sm": [

                      "headline-lg": [

                      ],
                      "body-md": [

                      ],
                      "headline-lg-mobile": [

                      ],

                      ]

              "fontSize": {
                      "headline-md": [

</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col items-center justify-center antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Container - Restricted Width for Minimalist Stream Focus -->
<main class="w-full max-w-max-width mx-auto flex flex-col h-screen md:h-auto md:min-h-[800px] md:border md:border-outline-variant md:rounded-3xl md:shadow-[0_0_40px_rgba(0,0,0,0.03)] bg-surface-container-lowest overflow-hidden relative">
<!-- Top Nav / Header Area -->
<header class="flex flex-col items-center justify-center pt-12 pb-6 px-margin-mobile flex-shrink-0">
<img alt="FOZ Logo" class="w-12 h-12 mb-4 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLuFUAAtVcovOo_ChuyzkjKQ1tRCZAFP8eGgWbDjfRzrDJ6sFrsoEmPx4C29hDSOBy8mZx1mA1OV1kbV68udWOPwbU7FjVBNhzHrt_wOhwJtrG6L4gpu4E_oV3FZNvPs4VuBbculDXsFyMC9REVdfFT5rm10Zrcnr85Q-bunJ4RVM0GmKAhkzcjv6j5b2nshf3bMgTd01RqmeyG1mpsttBL9XKy7IEDOTCDPgUr9uH8fhCiKNRvP2-y1las"/>
<h1 class="font-label-md text-label-md text-secondary uppercase tracking-widest">Sign Up</h1>
</header>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto px-margin-mobile pb-24 flex flex-col">
<div class="text-center mb-10">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2">Create your FOZ profile</h2>
<p class="font-body-md text-body-md text-secondary">Set up your public persona.</p>
</div>
<!-- Profile Form -->
<form class="flex flex-col gap-6 flex-1 max-w-sm w-full mx-auto" onsubmit="event.preventDefault();">
<!-- Avatar Upload Section (Interactive) -->
<div class="flex items-center justify-center mb-2">
<button class="group relative w-24 h-24 rounded-full bg-surface-container-low border border-outline-variant hover:border-primary transition-colors flex items-center justify-center overflow-hidden focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest" type="button">
<span class="material-symbols-outlined text-secondary group-hover:text-primary text-3xl transition-colors">add_photo_alternate</span>
<!-- Hidden input for file selection -->
<input accept="image/*" class="hidden" type="file"/>
</button>
</div>
<!-- Input Group: Name -->
<div class="relative">
<label class="block font-label-sm text-label-sm text-secondary mb-1 ml-1" for="name">Name</label>
<input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 font-body-md text-body-md text-primary placeholder:text-secondary-fixed-dim focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all" id="name" placeholder="John Doe" type="text"/>
</div>
<!-- Input Group: Username -->
<div class="relative">
<label class="block font-label-sm text-label-sm text-secondary mb-1 ml-1" for="username">Username</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-secondary-fixed-dim font-body-md">@</span>
<input class="w-full bg-surface-container-low border-none rounded-xl pl-8 pr-4 py-3 font-body-md text-body-md text-primary placeholder:text-secondary-fixed-dim focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all" id="username" placeholder="john_foz" type="text"/>
</div>
</div>
<!-- Input Group: Bio -->
<div class="relative">
<label class="block font-label-sm text-label-sm text-secondary mb-1 ml-1" for="bio">Bio</label>
<textarea class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 font-body-md text-body-md text-primary placeholder:text-secondary-fixed-dim focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all resize-none" id="bio" placeholder="Write a short bio..." rows="3"></textarea>
</div>
<!-- Input Group: Link -->
<div class="relative mb-4">
<label class="block font-label-sm text-label-sm text-secondary mb-1 ml-1" for="link">Link (optional)</label>
<div class="relative flex items-center">
<span class="absolute left-4 text-secondary-fixed-dim font-body-md material-symbols-outlined text-[18px]">link</span>
<input class="w-full bg-surface-container-low border-none rounded-xl pl-10 pr-4 py-3 font-body-md text-body-md text-primary placeholder:text-secondary-fixed-dim focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all" id="link" placeholder="yourwebsite.com" type="url"/>
</div>
</div>
<!-- Import Action -->
<button class="flex items-center justify-center gap-2 w-full py-3 px-4 rounded-xl border border-outline-variant bg-transparent text-primary font-label-md text-label-md hover:bg-surface-container-low transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
<span class="material-symbols-outlined text-[18px]">cloud_download</span>
                    Import from Instagram
                </button>
</form>
</div>
<!-- Sticky Bottom Actions -->
<div class="absolute bottom-0 left-0 w-full bg-surface-container-lowest/90 backdrop-blur-md border-t border-outline-variant p-margin-mobile flex flex-col gap-4 pb-8 md:pb-6">
<button class="w-full bg-primary text-on-primary rounded-xl py-4 font-label-md text-label-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
                Next
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<div class="flex items-center justify-between px-2">
<button class="text-secondary font-label-sm text-label-sm hover:text-primary transition-colors focus:outline-none focus:underline" type="button">
                    Skip for now
                </button>
<a class="text-secondary font-label-sm text-label-sm hover:text-primary transition-colors focus:outline-none focus:underline" href="#">
                    Already have an account? Log in
                </a>
</div>
</div>
</main>
</body></html>
