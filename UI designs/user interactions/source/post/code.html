<!-- TopNavBar -->
<nav class="fixed top-0 w-full z-50 flex justify-center items-center h-16 px-gutter max-w-desktop mx-auto bg-background/80 backdrop-blur-md border-b border-outline-variant flat no shadows hidden md:flex">
<div class="w-full flex justify-between items-center">
<div class="text-headline-bold font-headline-bold text-primary dark:text-primary">FOZ</div>
<div class="flex space-x-6">
<button class="text-primary dark:text-primary hover:opacity-70 transition-opacity active:scale-95 transition-transform flex flex-col items-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
</button>
<button class="text-outline dark:text-outline hover:opacity-70 transition-opacity active:scale-95 transition-transform flex flex-col items-center">

</button>

</button>

<!-- Section: Main Post -->
<section class="flex gap-3">

<div class="flex flex-col items-center shrink-0">

<div class="flex items-baseline gap-2">
<span class="font-label-sm text-label-sm text-on-surface">alex_tech</span>
<span class="font-label-timestamp text-label-timestamp text-outline">2h</span>
</div>
<button class="text-outline hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
</div>
<!-- Body -->
<p class="font-body-main text-body-main text-on-surface">Exploring the new minimalist UI for FOZ. What do you think?</p>
<!-- Attached Media -->
<div class="mt-2 rounded-xl overflow-hidden border border-surface-variant">
<img class="w-full h-auto object-cover max-h-[400px]" data-alt="A sleek, modern desk setup in a dimly lit room, focusing on a high-end monitor displaying a dark-mode interface. The workspace is meticulously organized with minimalist peripherals, a small succulent plant, and subtle, ambient LED backlighting in cool blue tones. The overall vibe is premium, focused, and technologically advanced, fitting perfectly into a dark, immersive aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCv4XuNKMJXx7DrloeMJbBLnNjyLfQzQj9kCeNaYcY-KoDRZPhZRNxTLiHK5WDH4ZYkV_OEsPkrRHw0mteI5x49eWTBFanFubnvyaYNEqGf8o7C9rLjhafnPqCzeye5_pM4MRmzMeqTme8bTcY6qhYpcgwUjDcOJsZwzNt917pimdi3FouyFnjUhgkqkt2YL-JtJPY9A4ZUYFSNeCOme78KONDSYVOzFRBytecYBtX5f4B76z2nfnYDe052KubnV7-SOqVwGVvUebWQ">

<span class="material-symbols-outlined text-[20px] group-active:scale-90 transition-transform">favorite</span>
<span class="font-label-sm text-label-sm">41</span>

</button>
<button class="flex items-center gap-1.5 hover:text-on-surface transition-colors group">
<span class="material-symbols-outlined text-[20px] group-active:scale-90 transition-transform">repeat</span>
<span class="font-label-sm text-label-sm">5</span>
</button>
<button class="flex items-center gap-1.5 hover:text-on-surface transition-colors group ml-auto">
<span class="material-symbols-outlined text-[20px] group-active:scale-90 transition-transform">share</span>
</button>
</div>
</div>

<section class="flex flex-col gap-6">

<!-- Default State -->

<div class="flex items-center gap-6 text-outline">

</button>
<button class="flex items-center gap-1.5 hover:text-on-surface transition-colors">

<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
<span class="font-label-sm text-label-sm">42</span>
</button>
<button class="flex items-center gap-1.5 hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[20px]">chat_bubble</span>

</button>
<button class="flex items-center gap-1.5 hover:text-on-surface transition-colors">

<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">repeat</span>

</button>
<button class="flex items-center gap-1.5 hover:text-on-surface transition-colors ml-auto">
