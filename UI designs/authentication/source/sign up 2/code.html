<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md antialiased selection:bg-primary selection:text-on-primary">
<main class="w-full max-w-max-width px-margin-mobile md:px-margin-desktop py-8 flex flex-col min-h-screen justify-between relative">
<div class="flex-1 flex flex-col items-center w-full max-w-[400px] mx-auto mt-12">
<header class="w-full flex flex-col items-center mb-10 text-center">
<img alt="FOZ Logo" class="w-16 h-16 object-contain mb-2 invert dark:invert-0" src="https://lh3.googleusercontent.com/aida/AP1WRLuFUAAtVcovOo_ChuyzkjKQ1tRCZAFP8eGgWbDjfRzrDJ6sFrsoEmPx4C29hDSOBy8mZx1mA1OV1kbV68udWOPwbU7FjVBNhzHrt_wOhwJtrG6L4gpu4E_oV3FZNvPs4VuBbculDXsFyMC9REVdfFT5rm10Zrcnr85Q-bunJ4RVM0GmKAhkzcjv6j5b2nshf3bMgTd01RqmeyG1mpsttBL9XKy7IEDOTCDPgUr9uH8fhCiKNRvP2-y1las"/>
<span class="font-label-md text-label-md text-secondary tracking-widest uppercase mb-6">Sign Up</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2">Security details</h1>
<p class="font-body-md text-body-md text-secondary">Set your login credentials.</p>
</header>
<form class="w-full space-y-6">
<div class="space-y-1">
<label class="font-label-md text-label-md text-primary block px-1" for="username">Username</label>
<input class="w-full bg-surface-container-low text-primary font-body-md text-body-md rounded-xl px-4 py-3 border-none focus:ring-0 cursor-not-allowed opacity-70" disabled="" id="username" type="text" value="@john_foz"/>
</div>
<div class="space-y-1 relative group">
<label class="font-label-md text-label-md text-primary block px-1" for="password">Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low focus:bg-background text-primary font-body-md text-body-md rounded-xl px-4 py-3 border border-transparent focus:border-primary focus:ring-0 transition-colors placeholder:text-outline" id="password" placeholder="Create a password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-4 flex items-center text-secondary hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
<div class="space-y-1 relative group">
<label class="font-label-md text-label-md text-primary block px-1" for="confirm-password">Confirm Password</label>
<div class="relative">
<input class="w-full bg-surface-container-low focus:bg-background text-primary font-body-md text-body-md rounded-xl px-4 py-3 border border-transparent focus:border-primary focus:ring-0 transition-colors placeholder:text-outline" id="confirm-password" placeholder="Confirm your password" type="password"/>
<button aria-label="Toggle confirm password visibility" class="absolute inset-y-0 right-0 pr-4 flex items-center text-secondary hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
</div>
</form>
</div>
<div class="w-full max-w-[400px] mx-auto mt-8 flex flex-col items-center pb-8">
<button class="w-full bg-primary text-on-primary rounded-xl py-4 font-label-md text-label-md flex items-center justify-center gap-2 hover:bg-inverse-surface transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary mb-6" type="button">
                Sign up
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<a class="font-body-md text-body-md text-secondary hover:text-primary transition-colors" href="#">
                Already have an account? <span class="font-label-md">Log in</span>
</a>
</div>
</main>
<script>
        document.querySelectorAll('button[aria-label^="Toggle"]').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                }
            });
        });
    </script>
