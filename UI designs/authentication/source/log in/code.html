<script>
        // Minimal interactive logic for password toggle
        document.addEventListener('DOMContentLoaded', () => {
            const togglePasswordBtn = document.querySelector('button[type="button"]:not(.w-full)');
            const passwordInput = document.querySelector('input[type="password"]');
            const iconSpan = togglePasswordBtn.querySelector('.material-symbols-outlined');

            if(togglePasswordBtn && passwordInput && iconSpan) {
                togglePasswordBtn.addEventListener('click', () => {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    
                    if (type === 'text') {
                        iconSpan.textContent = 'visibility_off';
                        iconSpan.setAttribute('data-icon', 'visibility_off');
                    } else {
                        iconSpan.textContent = 'visibility';
                        iconSpan.setAttribute('data-icon', 'visibility');
                    }
                });
            }
        });
    </script>
