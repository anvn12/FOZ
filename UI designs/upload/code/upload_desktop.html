<!-- Navigation Shell (Suppressed as per rules for focused modal intent, but included in DOM for context if requested by overarching system, though hidden) -->
<!-- The user requested a "focused, modal-style interface", so the main global navs are conceptually behind this modal -->
<script>
        // Simple auto-resize for textarea
        const tx = document.getElementsByTagName("textarea");
        for (let i = 0; i < tx.length; i++) {
            tx[i].setAttribute("style", "height:" + (tx[i].scrollHeight) + "px;overflow-y:hidden;");
            tx[i].addEventListener("input", OnInput, false);
        }

        function OnInput() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + "px";
        }
    </script>
