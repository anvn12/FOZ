services:
  db:
    image: postgres:16
    container_name: foz_db
    environment:
      POSTGRES_USER: foz
      POSTGRES_PASSWORD: foz
      POSTGRES_DB: foz_dev
    ports:
      - "5432:5432"
    volumes:
      - foz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foz -d foz_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  foz_pg_data:
